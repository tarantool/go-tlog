name: govulncheck

# Vulnerability data changes independently of this repository, so a green
# result on the last push says nothing a week later. Run it on a schedule as
# well as on changes to the dependency set.
on:
  push:
    branches: [master]
    paths:
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  schedule:
    - cron: "0 0 * * 6" # Weekly on Saturday at 00:00 UTC.
  workflow_dispatch:

env:
  GOVULNCHECK_VERSION: latest

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...
