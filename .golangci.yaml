version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
  settings:
    revive:
      severity: warning
      rules:
        - name: unused-parameter
        - name: unreachable-code
        - name: indent-error-flow
        - name: exported
        - name: blank-imports
        - name: var-declaration
        - name: if-return
    misspell:
      locale: US
  exclusions:
    rules:
      - path: ^_examples/
        linters: [revive, staticcheck, govet, gocritic]
      - path: \.pb\.go$|_gen\.go$
        linters: [all]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/tarantool/go-tlog]
